<!DOCTYPE html>
<html>
<head>
    <title>TurtleBot Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>TurtleBot3 Dashboard</h1>

        <div class="status">
            <p>Connection:
                <span id="connection">Disconnected</span>
            </p>

            <p>Linear Velocity:
                <span id="linear">0.0</span>
            </p>

            <p>Angular Velocity:
                <span id="angular">0.0</span>
            </p>
        </div>

        <div class="controls">

            <h2>Robot Controls</h2>
            <div class="button-grid">
                <button id="forwardBtn">Forward</button>
                <div class="middle-row">
                    <button id="leftBtn">Left</button>
                    <button id="stopBtn">Stop</button>
                    <button id="rightBtn">Right</button>
                </div>

                <button id="backwardBtn">Backward</button>
            </div>

        </div>

        <div class="slider-section">

            <h2>Speed Control</h2>

            <input
                type="range"
                min="0.05"
                max="1.0"
                step="0.05"
                value="0.2"
                id="speedSlider">

        </div>

        <button id="stopButton">
            EMERGENCY STOP
        </button>

        <div class="camera">

            <h2>Robot Camera Feed</h2>

            <img
                id="cameraFeed"
                src="http://localhost:8080/stream?topic=/camera/image_raw"
                alt="Camera Feed">

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
